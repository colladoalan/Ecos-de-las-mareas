<svg viewBox="0 0 1100 780" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">
<defs>
  <radialGradient id="waterGrad" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="#0f2a3a"/>
    <stop offset="100%" stop-color="#081824"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1a3a4a" stroke-width="0.6"/>
  </pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 Z" fill="#C97B4A"/>
  </marker>
</defs>

<rect width="1100" height="780" fill="url(#waterGrad)"/>
<rect width="1100" height="780" fill="url(#grid)"/>

<text x="30" y="42" fill="#EFE6D2" font-size="22" font-weight="600" font-family="Georgia, serif">NODO ANCLA 7</text>
<text x="30" y="62" fill="#2DD4C8" font-size="11" letter-spacing="2">EL ECO DE LAS MAREAS — DIAGRAMA DE REFERENCIA (VISTA AEREA) — GEOMETRIA HIBRIDA</text>
<line x1="30" y1="72" x2="1070" y2="72" stroke="#2DD4C8" stroke-width="0.5" opacity="0.4"/>

<g transform="translate(1020,110)">
  <circle r="26" fill="none" stroke="#5f7280" stroke-width="1"/>
  <path d="M0,-20 L5,0 L0,9 L-5,0 Z" fill="#2DD4C8"/>
  <text x="0" y="-30" fill="#a9b8c2" font-size="10" text-anchor="middle">N</text>
</g>

<path d="M -20 700 Q 150 640 260 560" stroke="#C97B4A" stroke-width="2" fill="none" stroke-dasharray="8,6"/>
<text x="20" y="720" fill="#C97B4A" font-size="12">RUTA DESDE MAR DEL PLATA (~100km)</text>

<!-- Bridges connecting circular modules -->
<line x1="430" y1="330" x2="560" y2="290" stroke="#3a5a5a" stroke-width="5"/>
<line x1="560" y1="290" x2="640" y2="400" stroke="#3a5a5a" stroke-width="5"/>
<line x1="430" y1="330" x2="480" y2="440" stroke="#3a5a5a" stroke-width="5"/>
<line x1="480" y1="440" x2="640" y2="400" stroke="#3a5a5a" stroke-width="5"/>
<!-- Branching arm connections -->
<line x1="640" y1="400" x2="800" y2="360" stroke="#3a5a5a" stroke-width="5"/>
<line x1="800" y1="360" x2="930" y2="320" stroke="#3a5a5a" stroke-width="5"/>

<!-- Circular module 1 (hub with console) -->
<g transform="translate(430,330)">
  <circle r="80" fill="#123a34" stroke="#2DD4C8" stroke-width="2"/>
  <circle r="80" fill="none" stroke="#2DD4C8" stroke-width="0.6" opacity="0.5"/>
  <g stroke="#7fe8dc" stroke-width="0.7" opacity="0.6">
    <line x1="-70" y1="0" x2="70" y2="0"/><line x1="0" y1="-70" x2="0" y2="70"/>
    <line x1="-50" y1="-50" x2="50" y2="50"/><line x1="-50" y1="50" x2="50" y2="-50"/>
  </g>
  <circle r="16" fill="#0d1c2b" stroke="#2DD4C8" stroke-width="2"/>
  <rect x="-9" y="-9" width="18" height="18" fill="#C24444" opacity="0.85"/>
  <text x="0" y="105" fill="#EFE6D2" font-size="12" font-weight="600" text-anchor="middle">HUB CENTRAL</text>
  <text x="0" y="120" fill="#a9b8c2" font-size="9.5" text-anchor="middle">Consola física (Mateo + Clara)</text>
</g>

<!-- Circular module 2 -->
<g transform="translate(560,290)">
  <circle r="65" fill="#123a34" stroke="#2DD4C8" stroke-width="1.5"/>
  <g stroke="#7fe8dc" stroke-width="0.6" opacity="0.6">
    <line x1="-55" y1="0" x2="55" y2="0"/><line x1="0" y1="-55" x2="0" y2="55"/>
    <line x1="-40" y1="-40" x2="40" y2="40"/><line x1="-40" y1="40" x2="40" y2="-40"/>
  </g>
  <circle r="10" fill="#0d1c2b" stroke="#2DD4C8" stroke-width="1.5"/>
  <text x="0" y="82" fill="#7fe8dc" font-size="10" text-anchor="middle">MÓDULO — CULTIVO RADIAL</text>
</g>

<!-- Circular module 3 -->
<g transform="translate(640,400)">
  <circle r="70" fill="#123a34" stroke="#2DD4C8" stroke-width="1.5"/>
  <g stroke="#7fe8dc" stroke-width="0.6" opacity="0.6">
    <line x1="-60" y1="0" x2="60" y2="0"/><line x1="0" y1="-60" x2="0" y2="60"/>
    <line x1="-42" y1="-42" x2="42" y2="42"/><line x1="-42" y1="42" x2="42" y2="-42"/>
  </g>
  <circle r="11" fill="#0d1c2b" stroke="#2DD4C8" stroke-width="1.5"/>
  <text x="0" y="88" fill="#7fe8dc" font-size="10" text-anchor="middle">MÓDULO — CULTIVO RADIAL</text>
</g>

<!-- Circular module 4 -->
<g transform="translate(480,440)">
  <circle r="55" fill="#123a34" stroke="#2DD4C8" stroke-width="1.5"/>
  <g stroke="#7fe8dc" stroke-width="0.6" opacity="0.6">
    <line x1="-45" y1="0" x2="45" y2="0"/><line x1="0" y1="-45" x2="0" y2="45"/>
  </g>
  <text x="0" y="72" fill="#7fe8dc" font-size="9.5" text-anchor="middle">TANQUES / SILOS</text>
</g>

<!-- Branching arm modules -->
<g transform="translate(800,360)">
  <ellipse rx="60" ry="36" fill="#123a34" stroke="#2DD4C8" stroke-width="1.5"/>
  <text x="0" y="6" fill="#7fe8dc" font-size="10" text-anchor="middle">BRAZO — INVERNADERO</text>
</g>
<g transform="translate(930,320)">
  <ellipse rx="55" ry="32" fill="#123a34" stroke="#2DD4C8" stroke-width="1.5"/>
  <text x="0" y="6" fill="#7fe8dc" font-size="10" text-anchor="middle">BRAZO — INVERNADERO</text>
</g>

<!-- Aquaculture cages -->
<g transform="translate(560,530)">
  <circle r="24" fill="none" stroke="#2DD4C8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="0" y="40" fill="#7fe8dc" font-size="9" text-anchor="middle">Jaulas de</text>
  <text x="0" y="52" fill="#7fe8dc" font-size="9" text-anchor="middle">acuicultura</text>
</g>
<circle cx="620" cy="560" r="20" fill="none" stroke="#2DD4C8" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="510" cy="570" r="18" fill="none" stroke="#2DD4C8" stroke-width="1.5" stroke-dasharray="3,3"/>

<!-- Wind turbines (own floating platforms, separate) -->
<g transform="translate(300,220)">
  <circle r="14" fill="#1a2a20" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-14" x2="0" y2="-40" stroke="#EFE6D2" stroke-width="1.5"/>
  <line x1="0" y1="-40" x2="-10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-40" x2="10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <text x="0" y="30" fill="#EFE6D2" font-size="8.5" text-anchor="middle">Turbina</text>
</g>
<g transform="translate(250,470)">
  <circle r="14" fill="#1a2a20" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-14" x2="0" y2="-40" stroke="#EFE6D2" stroke-width="1.5"/>
  <line x1="0" y1="-40" x2="-10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-40" x2="10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <text x="0" y="30" fill="#EFE6D2" font-size="8.5" text-anchor="middle">Turbina</text>
</g>
<g transform="translate(750,220)">
  <circle r="14" fill="#1a2a20" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-14" x2="0" y2="-40" stroke="#EFE6D2" stroke-width="1.5"/>
  <line x1="0" y1="-40" x2="-10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <line x1="0" y1="-40" x2="10" y2="-30" stroke="#EFE6D2" stroke-width="1"/>
  <text x="0" y="30" fill="#EFE6D2" font-size="8.5" text-anchor="middle">Turbina</text>
</g>

<!-- Puerto de carga grande -->
<g transform="translate(880,540)">
  <rect x="-90" y="-40" width="180" height="80" rx="6" fill="#1a2a20" stroke="#C97B4A" stroke-width="2"/>
  <rect x="-70" y="-20" width="60" height="18" fill="#4a3a20" opacity="0.8"/>
  <rect x="10" y="-20" width="60" height="18" fill="#4a3a20" opacity="0.8"/>
  <line x1="-60" y1="-20" x2="-60" y2="-38" stroke="#e8c840" stroke-width="2"/>
  <line x1="40" y1="-20" x2="40" y2="-38" stroke="#e8c840" stroke-width="2"/>
  <text x="0" y="52" fill="#C97B4A" font-size="12" text-anchor="middle" font-weight="600">PUERTO DE CARGA</text>
  <text x="0" y="66" fill="#C97B4A" font-size="9.5" text-anchor="middle">buques grandes, grúas amarillas</text>
</g>
<line x1="800" y1="500" x2="800" y2="396" stroke="#3a5a5a" stroke-width="4"/>

<!-- Marina chica para el Benteveo (apartada) -->
<g transform="translate(220,600)">
  <rect x="-55" y="-28" width="110" height="56" rx="6" fill="#1a2a20" stroke="#C97B4A" stroke-width="2"/>
  <line x1="-40" y1="-13" x2="40" y2="-13" stroke="#C97B4A" stroke-width="1.5"/>
  <line x1="-40" y1="0" x2="40" y2="0" stroke="#C97B4A" stroke-width="1.5"/>
  <line x1="-40" y1="13" x2="40" y2="13" stroke="#C97B4A" stroke-width="1.5"/>
  <rect x="18" y="-8" width="14" height="7" fill="#EFE6D2" opacity="0.8"/>
  <text x="0" y="44" fill="#C97B4A" font-size="11" text-anchor="middle" font-weight="600">MARINA CHICA</text>
  <text x="0" y="57" fill="#C97B4A" font-size="9.5" text-anchor="middle">aparte — llega el Benteveo</text>
</g>
<path d="M 260 560 L 235 585" stroke="#C97B4A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

<!-- Legend -->
<g transform="translate(30,660)">
  <rect x="0" y="0" width="480" height="105" fill="#081019" stroke="#2DD4C8" stroke-width="0.7" opacity="0.9"/>
  <text x="14" y="20" fill="#2DD4C8" font-size="11" font-weight="600">REFERENCIAS</text>
  <circle cx="22" cy="36" r="7" fill="#123a34" stroke="#2DD4C8"/>
  <text x="36" y="40" fill="#EFE6D2" font-size="10">Módulos circulares (invernadero + cultivo radial)</text>
  <ellipse cx="22" cy="54" rx="9" ry="6" fill="#123a34" stroke="#2DD4C8"/>
  <text x="36" y="58" fill="#EFE6D2" font-size="10">Brazo ramificado (más invernaderos)</text>
  <circle cx="22" cy="72" r="14" fill="#1a2a20" stroke="#EFE6D2"/>
  <text x="42" y="76" fill="#EFE6D2" font-size="10">Turbina eólica en plataforma propia</text>
  <circle cx="22" cy="90" r="8" fill="none" stroke="#2DD4C8" stroke-dasharray="2,2"/>
  <text x="36" y="94" fill="#EFE6D2" font-size="10">Jaula de acuicultura</text>
</g>

<g transform="translate(540,660)">
  <rect x="0" y="0" width="530" height="105" fill="#081019" stroke="#C97B4A" stroke-width="0.7" opacity="0.9"/>
  <text x="14" y="20" fill="#C97B4A" font-size="11" font-weight="600">NOTAS DE DISEÑO</text>
  <text x="14" y="38" fill="#EFE6D2" font-size="9.5">Geometría híbrida: módulos circulares con puentes + brazo ramificado.</text>
  <text x="14" y="52" fill="#EFE6D2" font-size="9.5">Perfil bajo, disperso — NO plataforma petrolera. Anclado al fondo,</text>
  <text x="14" y="66" fill="#EFE6D2" font-size="9.5">no visible desde la superficie. Escala grande, horizontal.</text>
  <text x="14" y="84" fill="#EFE6D2" font-size="9.5">Dos puertos que conviven: carga grande + marina chica aparte.</text>
</g>

</svg>
