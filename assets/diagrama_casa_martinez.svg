<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">

<rect width="1000" height="640" fill="#0B1826"/>
<pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
  <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#152a3a" stroke-width="0.5"/>
</pattern>
<rect width="1000" height="640" fill="url(#grid2)"/>

<text x="30" y="42" fill="#EFE6D2" font-size="22" font-weight="600" font-family="Georgia, serif">CASA MARTÍNEZ</text>
<text x="30" y="62" fill="#2DD4C8" font-size="11" letter-spacing="2">EL ECO DE LAS MAREAS — PLANO DE REFERENCIA (PLANTA)</text>
<line x1="30" y1="72" x2="970" y2="72" stroke="#2DD4C8" stroke-width="0.5" opacity="0.4"/>

<!-- Costa de fondo (abajo, orientación: la terraza mira al mar) -->
<rect x="60" y="500" width="880" height="60" fill="#0f2a3a"/>
<text x="500" y="535" fill="#5f8a9a" font-size="11" text-anchor="middle" letter-spacing="1">↓ VISTA A LA COSTA DE MAR DEL PLATA (abajo del plano)</text>

<!-- TERRAZA -->
<g>
  <rect x="150" y="330" width="620" height="170" fill="#0d1c2b" stroke="#C97B4A" stroke-width="2"/>
  <text x="460" y="356" fill="#C97B4A" font-size="14" font-weight="600" text-anchor="middle">TERRAZA</text>

  <!-- parrilla -->
  <g transform="translate(230,410)">
    <rect x="-30" y="-18" width="60" height="36" rx="4" fill="#3a2a1a" stroke="#C97B4A" stroke-width="1.5"/>
    <text x="0" y="42" fill="#EFE6D2" font-size="10" text-anchor="middle">Parrilla</text>
  </g>

  <!-- mesa exterior -->
  <g transform="translate(460,430)">
    <ellipse rx="60" ry="30" fill="#3a2a1a" stroke="#C97B4A" stroke-width="1.5"/>
    <text x="0" y="6" fill="#EFE6D2" font-size="10" text-anchor="middle">Mesa exterior</text>
  </g>

  <!-- reposera / zona relax -->
  <g transform="translate(680,420)">
    <rect x="-35" y="-20" width="70" height="40" rx="6" fill="#2a3a3a" stroke="#C97B4A" stroke-width="1"/>
    <text x="0" y="46" fill="#EFE6D2" font-size="10" text-anchor="middle">Zona de estar</text>
  </g>
</g>

<!-- VENTANAL grande entre terraza y living -->
<rect x="150" y="322" width="620" height="10" fill="#2DD4C8" opacity="0.7"/>
<text x="460" y="315" fill="#2DD4C8" font-size="10" text-anchor="middle">VENTANAL CORREDIZO (terraza ↔ living-comedor)</text>

<!-- LIVING-COMEDOR -->
<g>
  <rect x="150" y="150" width="400" height="172" fill="#0d1c2b" stroke="#5f8a9a" stroke-width="1.5"/>
  <text x="350" y="176" fill="#a9c9d9" font-size="13" font-weight="600" text-anchor="middle">LIVING - COMEDOR</text>
  <text x="350" y="192" fill="#5f8a9a" font-size="9.5" text-anchor="middle">conectado directo a la terraza por el ventanal</text>
</g>

<!-- Pasillo/muro divisor -->
<line x1="550" y1="150" x2="550" y2="322" stroke="#3a5a5a" stroke-width="3"/>

<!-- OFICINA DE CLARA -->
<g>
  <rect x="550" y="150" width="220" height="172" fill="#0d1c2b" stroke="#2DD4C8" stroke-width="2"/>
  <text x="660" y="176" fill="#2DD4C8" font-size="13" font-weight="600" text-anchor="middle">OFICINA DE CLARA</text>
  <text x="660" y="192" fill="#7fe8dc" font-size="9.5" text-anchor="middle">ambiente separado, puerta propia</text>

  <!-- terminal holografica -->
  <g transform="translate(660,240)">
    <rect x="-45" y="-25" width="90" height="50" fill="none" stroke="#2DD4C8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="0" y="5" fill="#7fe8dc" font-size="9" text-anchor="middle">Pantallas</text>
    <text x="0" y="17" fill="#7fe8dc" font-size="9" text-anchor="middle">holográficas</text>
  </g>

  <!-- ventana propia -->
  <rect x="750" y="180" width="10" height="60" fill="#2DD4C8" opacity="0.6"/>
  <text x="785" y="215" fill="#5f8a9a" font-size="9" text-anchor="middle" transform="rotate(90 785 215)">ventana propia</text>
</g>

<!-- Puerta living -> oficina -->
<rect x="546" y="270" width="8" height="35" fill="#0B1826"/>
<text x="560" y="292" fill="#5f7280" font-size="8.5">puerta</text>

<!-- Notas -->
<g transform="translate(30,560)">
  <rect x="0" y="0" width="940" height="60" fill="#081019" stroke="#C97B4A" stroke-width="0.6" opacity="0.9"/>
  <text x="14" y="18" fill="#C97B4A" font-size="10.5" font-weight="600">NOTA</text>
  <text x="14" y="34" fill="#EFE6D2" font-size="10">La terraza se conecta directo al living-comedor por un ventanal corredizo grande. La oficina de Clara es un</text>
  <text x="14" y="48" fill="#EFE6D2" font-size="10">ambiente aparte, con puerta propia y su propia ventana — no se ve directamente desde la terraza.</text>
</g>

</svg>
