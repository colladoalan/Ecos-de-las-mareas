<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Eco de las Mareas — Centro de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --ink:#0B1826;
    --ink-2:#122236;
    --paper:#EFE6D2;
    --paper-2:#E4D8BC;
    --paper-line:#C9BC9E;
    --teal:#2DD4C8;
    --teal-dim:#1a8f86;
    --copper:#C97B4A;
    --ink-text:#1c2b1f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 28px;
    border-bottom:1px solid rgba(239,230,210,0.15);
    background:radial-gradient(ellipse at 0% 0%, rgba(45,212,200,0.10), transparent 60%), var(--ink);
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--teal);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:0;
  }
  nav{
    border-right:1px solid rgba(239,230,210,0.12);
    padding:20px 14px;
    overflow-y:auto;
  }
  nav .nav-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#5f7280;
    padding:6px 10px 10px;
    margin-top:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
  }
  nav .nav-label:hover{ color:var(--teal); }
  nav .nav-label .chevron{
    font-size:9px;
    transition:transform .15s;
    display:inline-block;
  }
  nav .nav-label.collapsed .chevron{ transform:rotate(-90deg); }
  .nav-group-items{
    overflow:hidden;
  }
  .nav-group-items.collapsed{ display:none; }
  nav .nav-label:first-child{ margin-top:0; }
  nav button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#a9b8c2;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:10px 10px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:2px;
    line-height:1.4;
    border-left:2px solid transparent;
  }
  nav button:hover{ background:rgba(45,212,200,0.08); color:var(--paper); }
  nav button.active{
    background:rgba(45,212,200,0.12);
    color:var(--paper);
    border-left:2px solid var(--teal);
    font-weight:500;
  }
  nav button .doc-desc{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#5f7280;
    margin-top:2px;
  }
  main{
    overflow-y:auto;
    padding:44px clamp(20px,5vw,72px) 80px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(45,212,200,0.06), transparent 55%),
      var(--ink);
  }
  .doc{
    max-width:780px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink-text);
    border-radius:6px;
    padding:44px 48px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .doc h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 4px;
    line-height:1.1;
  }
  .doc h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:32px 0 10px;
    padding-top:14px;
    border-top:1px solid var(--paper-line);
  }
  .doc h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16.5px;
    margin:22px 0 8px;
    color:#3a4a3a;
  }
  .doc h3 + p, .doc h3 + pre { margin-top:0; }
  .doc p{ font-size:14.5px; line-height:1.65; margin:0 0 14px; }
  .doc strong{ color:#0f1a12; }
  .doc em{ color:#4a5a48; }
  .doc ul, .doc ol{ font-size:14.5px; line-height:1.65; padding-left:22px; margin:0 0 14px;}
  .doc li{ margin-bottom:4px; }
  .doc hr{ border:none; border-top:1px dashed var(--paper-line); margin:26px 0; }
  .doc code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(0,0,0,0.06);
    padding:1px 5px;
    border-radius:3px;
  }
  .doc .code-wrap{
    position:relative;
    margin:0 0 16px;
  }
  .doc pre{
    background:var(--ink);
    color:#cfe8e4;
    border-left:3px solid var(--copper);
    padding:16px 16px 16px;
    border-radius:4px;
    overflow-x:auto;
    margin:0;
  }
  .doc pre code{
    background:none;
    padding:0;
    font-size:12.5px;
    line-height:1.8;
    color:#cfe8e4;
    white-space:pre-wrap;
  }
  .copy-btn{
    position:absolute;
    top:8px;
    right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#cfe8e4;
    background:rgba(45,212,200,0.12);
    border:1px solid rgba(45,212,200,0.35);
    border-radius:4px;
    padding:5px 9px;
    cursor:pointer;
  }
  .copy-btn:hover{ background:rgba(45,212,200,0.22); }
  .copy-btn.copied{ background:var(--teal); color:#08201c; border-color:var(--teal); }


  .doc table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 16px;}
  .doc th, .doc td{ border:1px solid var(--paper-line); padding:6px 10px; text-align:left; }
  .doc th{ background:rgba(0,0,0,0.05); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;}

  .doc img{
    max-width:320px;
    display:block;
    border-radius:6px;
    border:1px solid var(--paper-line);
    margin:14px 0;
    cursor:zoom-in;
    transition:opacity .15s;
  }
  .doc img:hover{ opacity:0.85; }

  .lightbox-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,16,25,0.92);
    z-index:1000;
    align-items:center;
    justify-content:center;
    cursor:zoom-out;
    padding:30px;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{
    max-width:95vw;
    max-height:92vh;
    border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .lightbox-close{
    position:fixed;
    top:20px;
    right:28px;
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:rgba(45,212,200,0.15);
    border:1px solid rgba(45,212,200,0.4);
    border-radius:4px;
    padding:8px 14px;
    cursor:pointer;
  }
  .lightbox-nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    background:rgba(45,212,200,0.15);
    border:1px solid rgba(45,212,200,0.4);
    color:#EFE6D2;
    font-size:22px;
    width:48px;
    height:48px;
    border-radius:50%;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .lightbox-nav.visible{ display:flex; }
  #lightboxPrev{ left:24px; }
  #lightboxNext{ right:24px; }
  .lightbox-caption{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(8,16,25,0.7);
    padding:8px 16px;
    border-radius:4px;
  }

  .trailer-esc{ margin-bottom:44px; }
  .trailer-esc h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:#EFE6D2;
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(201,123,74,0.3);
  }
  .trailer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .trailer-thumb{
    cursor:zoom-in;
    border-radius:6px;
    overflow:hidden;
    border:1px solid rgba(239,230,210,0.15);
    background:#081019;
  }
  .trailer-thumb .frame16-9{
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
  }
  .trailer-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .2s;
  }
  .trailer-thumb:hover img{ transform:scale(1.04); }
  .trailer-thumb .thumb-label{
    padding:8px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#a9b8c2;
  }
  .trailer-links{
    margin:0 0 30px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .trailer-links a{
    color:var(--teal);
    text-decoration:none;
    border-bottom:1px dashed rgba(45,212,200,0.4);
  }

  .comments-toggle{
    margin:10px 0 18px;
    background:rgba(45,212,200,0.1);
    border:1px solid rgba(45,212,200,0.3);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:4px;
    cursor:pointer;
  }
  .comments-panel{
    display:none;
    margin:0 0 20px;
    padding:14px;
    background:#0d1c2b;
    border:1px solid rgba(45,212,200,0.2);
    border-radius:6px;
  }
  .comments-panel.open{ display:block; }

  .lightbox-comments-btn{
    position:fixed;
    bottom:24px;
    right:24px;
    background:rgba(45,212,200,0.18);
    border:1px solid rgba(45,212,200,0.45);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    z-index:1002;
  }
  .comments-drawer{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    width:min(420px, 92vw);
    background:#0B1826;
    border-left:1px solid rgba(45,212,200,0.3);
    z-index:1003;
    transform:translateX(100%);
    transition:transform .2s ease;
    overflow-y:auto;
    padding:20px;
  }
  .comments-drawer.open{ transform:translateX(0); }
  .comments-drawer h4{
    font-family:'Fraunces',serif;
    color:#EFE6D2;
    font-size:16px;
    margin:0 0 4px;
  }
  .comments-drawer .term-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--teal);
    margin-bottom:14px;
  }
  .comments-drawer-close{
    background:rgba(201,123,74,0.15);
    border:1px solid rgba(201,123,74,0.4);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:16px;
  }

  .empty-state{
    max-width:480px;
    margin:120px auto;
    text-align:center;
    color:#7f92a0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  .home{
    max-width:960px;
    margin:0 auto;
  }
  .home-intro{
    margin-bottom:40px;
  }
  .home-intro h2{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:32px;
    color:var(--paper);
    margin:0 0 10px;
  }
  .home-intro p{
    color:#a9b8c2;
    font-size:14.5px;
    line-height:1.6;
    max-width:70ch;
  }
  .home-group{
    margin-bottom:36px;
  }
  .home-group h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(45,212,200,0.2);
  }
  .home-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .home-card{
    text-align:left;
    background:var(--ink-2);
    border:1px solid rgba(239,230,210,0.12);
    border-radius:6px;
    padding:18px 20px;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    color:var(--paper);
    font-family:'Inter',sans-serif;
  }
  .home-card:hover{
    border-color:var(--teal);
    transform:translateY(-2px);
  }
  .home-card .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:6px;
  }
  .home-card .card-desc{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8fa0ac;
    line-height:1.5;
  }

  @media (max-width:720px){
    .layout{ grid-template-columns:1fr; }
    nav{ border-right:none; border-bottom:1px solid rgba(239,230,210,0.12); display:flex; overflow-x:auto; padding:10px; gap:4px; }
    nav .nav-label{ display:none; }
    nav button{ width:auto; white-space:nowrap; }
    .doc{ padding:28px 22px; }
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">El Eco de las Mareas · MESA CHICA</span>
  <h1>Centro de documentos</h1>
  <button id="homeBtn" style="margin-left:auto;background:rgba(45,212,200,0.12);border:1px solid rgba(45,212,200,0.35);color:#EFE6D2;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border-radius:4px;cursor:pointer;">← Inicio</button>
</header>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕ Cerrar</button>
  <button class="lightbox-nav" id="lightboxPrev">‹</button>
  <button class="lightbox-nav" id="lightboxNext">›</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption" style="display:none;"></div>
  <button class="lightbox-comments-btn" id="lightboxCommentsBtn" style="display:none;">💬 Comentarios</button>
</div>

<div class="comments-drawer" id="commentsDrawer">
  <button class="comments-drawer-close" id="commentsDrawerClose">✕ Cerrar comentarios</button>
  <h4 id="commentsDrawerTitle">Comentarios</h4>
  <div class="term-label" id="commentsDrawerTerm"></div>
  <div id="commentsDrawerBody"></div>
</div>

<div class="layout">
  <nav id="nav">
    <button id="trailerBtn" style="width:100%;margin-bottom:16px;background:rgba(201,123,74,0.15);border:1px solid rgba(201,123,74,0.4);color:#EFE6D2;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;border-radius:4px;cursor:pointer;">🎬 Tráiler</button>
  </nav>
  <main id="main"><div class="empty-state">Elegí un documento del menú.</div></main>
</div>

function b64ToUtf8(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

const grouped = {};
DOCS.forEach(doc => {

  });
});

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text){
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand copy failed'));
    } catch (err) {
      document.body.removeChild(ta);
      reject(err);
    }
  });
}

function addCopyButtons(container){
  container.querySelectorAll('pre').forEach(pre => {
    const codeEl = pre.querySelector('code');
    if (!codeEl) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copiar';
    btn.addEventListener('click', () => {
      copyText(codeEl.textContent).then(() => {
        btn.textContent = 'Copiado ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 1500);
      }).catch(() => {
        btn.textContent = 'Error — seleccioná y copiá';
        setTimeout(() => { btn.textContent = 'Copiar'; }, 2500);
      });
    });
    wrap.appendChild(btn);
  });
}

function selectDoc(id, btnEl){
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  const md = b64ToUtf8(doc.b64);
  main.innerHTML = '<article class="doc">' + marked.parse(md) + '</article>';
  addCopyButtons(main);
}

let currentGallery = null; // {gi, ii}
function openGalleryLightbox(gi, ii){
  currentGallery = {gi, ii};
  showGalleryImage();
  lightbox.classList.add('open');
}
function showGalleryImage(){
  const group = TRAILER_GALLERY[currentGallery.gi];
  const img = group.images[currentGallery.ii];
  lightboxImg.src = img.file;
  lightboxImg.alt = img.label;
  document.getElementById('lightboxCaption').textContent = group.title + ' — ' + img.label;
  document.getElementById('lightboxCaption').style.display = 'block';
  document.getElementById('lightboxPrev').classList.add('visible');
  document.getElementById('lightboxNext').classList.add('visible');
  document.getElementById('lightboxCommentsBtn').style.display = 'block';
}
document.getElementById('lightboxPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!currentGallery) return;
  const group = TRAILER_GALLERY[currentGallery.gi];
  currentGallery.ii = (currentGallery.ii - 1 + group.images.length) % group.images.length;
  showGalleryImage();
});
document.getElementById('lightboxNext').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!currentGallery) return;
  const group = TRAILER_GALLERY[currentGallery.gi];
  currentGallery.ii = (currentGallery.ii + 1) % group.images.length;
  showGalleryImage();
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open') || !currentGallery) return;
  if (e.key === 'ArrowLeft') document.getElementById('lightboxPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lightboxNext').click();
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
main.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG' && e.target.closest('.doc')) {
    currentGallery = null;
    document.getElementById('lightboxPrev').classList.remove('visible');
    document.getElementById('lightboxNext').classList.remove('visible');
    document.getElementById('lightboxCaption').style.display = 'none';
    document.getElementById('lightboxCommentsBtn').style.display = 'none';
    lightboxImg.src = e.target.src;
    lightboxImg.alt = e.target.alt || '';
    lightbox.classList.add('open');
  }
});
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src='';
  currentGallery = null;
  document.getElementById('lightboxPrev').classList.remove('visible');
  document.getElementById('lightboxNext').classList.remove('visible');
  document.getElementById('lightboxCaption').style.display = 'none';
  document.getElementById('lightboxCommentsBtn').style.display = 'none';
}
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.getElementById('lightboxClose').addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>

</body>
