<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Eco de las Mareas — Centro de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --ink:#0B1826;
    --ink-2:#122236;
    --paper:#EFE6D2;
    --paper-2:#E4D8BC;
    --paper-line:#C9BC9E;
    --teal:#2DD4C8;
    --teal-dim:#1a8f86;
    --copper:#C97B4A;
    --ink-text:#1c2b1f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 28px;
    border-bottom:1px solid rgba(239,230,210,0.15);
    background:radial-gradient(ellipse at 0% 0%, rgba(45,212,200,0.10), transparent 60%), var(--ink);
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--teal);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:0;
  }
  nav{
    border-right:1px solid rgba(239,230,210,0.12);
    padding:20px 14px;
    overflow-y:auto;
  }
  nav .nav-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#5f7280;
    padding:6px 10px 10px;
    margin-top:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    user-select:none;
  }
  nav .nav-label:hover{ color:var(--teal); }
  nav .nav-label .chevron{
    font-size:9px;
    transition:transform .15s;
    display:inline-block;
  }
  nav .nav-label.collapsed .chevron{ transform:rotate(-90deg); }
  .nav-group-items{
    overflow:hidden;
  }
  .nav-group-items.collapsed{ display:none; }
  nav .nav-label:first-child{ margin-top:0; }
  nav button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#a9b8c2;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:10px 10px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:2px;
    line-height:1.4;
    border-left:2px solid transparent;
  }
  nav button:hover{ background:rgba(45,212,200,0.08); color:var(--paper); }
  nav button.active{
    background:rgba(45,212,200,0.12);
    color:var(--paper);
    border-left:2px solid var(--teal);
    font-weight:500;
  }
  nav button .doc-desc{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#5f7280;
    margin-top:2px;
  }
  main{
    overflow-y:auto;
    padding:44px clamp(20px,5vw,72px) 80px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(45,212,200,0.06), transparent 55%),
      var(--ink);
  }
  .doc{
    max-width:780px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink-text);
    border-radius:6px;
    padding:44px 48px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .doc h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 4px;
    line-height:1.1;
  }
  .doc h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:32px 0 10px;
    padding-top:14px;
    border-top:1px solid var(--paper-line);
  }
  .doc h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16.5px;
    margin:22px 0 8px;
    color:#3a4a3a;
  }
  .doc h3 + p, .doc h3 + pre { margin-top:0; }
  .doc p{ font-size:14.5px; line-height:1.65; margin:0 0 14px; }
  .doc strong{ color:#0f1a12; }
  .doc em{ color:#4a5a48; }
  .doc ul, .doc ol{ font-size:14.5px; line-height:1.65; padding-left:22px; margin:0 0 14px;}
  .doc li{ margin-bottom:4px; }
  .doc hr{ border:none; border-top:1px dashed var(--paper-line); margin:26px 0; }
  .doc code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(0,0,0,0.06);
    padding:1px 5px;
    border-radius:3px;
  }
  .doc .code-wrap{
    position:relative;
    margin:0 0 16px;
  }
  .doc pre{
    background:var(--ink);
    color:#cfe8e4;
    border-left:3px solid var(--copper);
    padding:16px 16px 16px;
    border-radius:4px;
    overflow-x:auto;
    margin:0;
  }
  .doc pre code{
    background:none;
    padding:0;
    font-size:12.5px;
    line-height:1.8;
    color:#cfe8e4;
    white-space:pre-wrap;
  }
  .copy-btn{
    position:absolute;
    top:8px;
    right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#cfe8e4;
    background:rgba(45,212,200,0.12);
    border:1px solid rgba(45,212,200,0.35);
    border-radius:4px;
    padding:5px 9px;
    cursor:pointer;
  }
  .copy-btn:hover{ background:rgba(45,212,200,0.22); }
  .copy-btn.copied{ background:var(--teal); color:#08201c; border-color:var(--teal); }


  .doc table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 16px;}
  .doc th, .doc td{ border:1px solid var(--paper-line); padding:6px 10px; text-align:left; }
  .doc th{ background:rgba(0,0,0,0.05); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;}

  .doc img{
    max-width:320px;
    display:block;
    border-radius:6px;
    border:1px solid var(--paper-line);
    margin:14px 0;
    cursor:zoom-in;
    transition:opacity .15s;
  }
  .doc img:hover{ opacity:0.85; }

  .lightbox-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(8,16,25,0.92);
    z-index:1000;
    align-items:center;
    justify-content:center;
    cursor:zoom-out;
    padding:30px;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{
    max-width:95vw;
    max-height:92vh;
    border-radius:4px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  .lightbox-close{
    position:fixed;
    top:20px;
    right:28px;
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    background:rgba(45,212,200,0.15);
    border:1px solid rgba(45,212,200,0.4);
    border-radius:4px;
    padding:8px 14px;
    cursor:pointer;
  }
  .lightbox-nav{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    background:rgba(45,212,200,0.15);
    border:1px solid rgba(45,212,200,0.4);
    color:#EFE6D2;
    font-size:22px;
    width:48px;
    height:48px;
    border-radius:50%;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .lightbox-nav.visible{ display:flex; }
  #lightboxPrev{ left:24px; }
  #lightboxNext{ right:24px; }
  .lightbox-caption{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(8,16,25,0.7);
    padding:8px 16px;
    border-radius:4px;
  }

  .trailer-esc{ margin-bottom:44px; }
  .trailer-esc h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    color:#EFE6D2;
    margin:0 0 16px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(201,123,74,0.3);
  }
  .trailer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .trailer-thumb{
    cursor:zoom-in;
    border-radius:6px;
    overflow:hidden;
    border:1px solid rgba(239,230,210,0.15);
    background:#081019;
  }
  .trailer-thumb .frame16-9{
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
  }
  .trailer-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .2s;
  }
  .trailer-thumb:hover img{ transform:scale(1.04); }
  .trailer-thumb .thumb-label{
    padding:8px 10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#a9b8c2;
  }
  .trailer-links{
    margin:0 0 30px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
  }
  .trailer-links a{
    color:var(--teal);
    text-decoration:none;
    border-bottom:1px dashed rgba(45,212,200,0.4);
  }

  .edit-bar{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin:0 0 28px;
  }
  .edit-toggle-btn{
    background:rgba(45,212,200,0.12);
    border:1px solid rgba(45,212,200,0.4);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
  }
  .edit-toggle-btn.export{
    background:rgba(201,123,74,0.15);
    border-color:rgba(201,123,74,0.4);
  }
  .edit-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#8fa0ac;
  }
  .trailer-thumb.editing{
    cursor:grab;
    border-color:rgba(201,123,74,0.4);
  }
  .trailer-thumb.editing:active{ cursor:grabbing; }
  .trailer-thumb.drag-over{
    border-color:var(--teal);
    box-shadow:0 0 0 2px rgba(45,212,200,0.4) inset;
  }
  .thumb-label-input{
    width:100%;
    box-sizing:border-box;
    padding:8px 10px;
    background:#0d1c2b;
    border:none;
    border-top:1px solid rgba(201,123,74,0.3);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
  }

  .comments-toggle{
    margin:10px 0 18px;
    background:rgba(45,212,200,0.1);
    border:1px solid rgba(45,212,200,0.3);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:7px 12px;
    border-radius:4px;
    cursor:pointer;
  }
  .comments-panel{
    display:none;
    margin:0 0 20px;
    padding:14px;
    background:#0d1c2b;
    border:1px solid rgba(45,212,200,0.2);
    border-radius:6px;
  }
  .comments-panel.open{ display:block; }

  .lightbox-comments-btn{
    position:fixed;
    bottom:24px;
    right:24px;
    background:rgba(45,212,200,0.18);
    border:1px solid rgba(45,212,200,0.45);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    z-index:1002;
  }
  .lightbox-download-btn{
    position:fixed;
    bottom:24px;
    left:24px;
    background:rgba(201,123,74,0.18);
    border:1px solid rgba(201,123,74,0.45);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:9px 16px;
    border-radius:6px;
    cursor:pointer;
    z-index:1002;
    text-decoration:none;
    display:none;
  }
  .comments-drawer{
    position:fixed;
    top:0;
    right:0;
    bottom:0;
    width:min(420px, 92vw);
    background:#0B1826;
    border-left:1px solid rgba(45,212,200,0.3);
    z-index:1003;
    transform:translateX(100%);
    transition:transform .2s ease;
    overflow-y:auto;
    padding:20px;
  }
  .comments-drawer.open{ transform:translateX(0); }
  .comments-drawer h4{
    font-family:'Fraunces',serif;
    color:#EFE6D2;
    font-size:16px;
    margin:0 0 4px;
  }
  .comments-drawer .term-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--teal);
    margin-bottom:14px;
  }
  .comments-drawer-close{
    background:rgba(201,123,74,0.15);
    border:1px solid rgba(201,123,74,0.4);
    color:#EFE6D2;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:16px;
  }

  .empty-state{
    max-width:480px;
    margin:120px auto;
    text-align:center;
    color:#7f92a0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  .home{
    max-width:960px;
    margin:0 auto;
  }
  .home-intro{
    margin-bottom:40px;
  }
  .home-intro h2{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:32px;
    color:var(--paper);
    margin:0 0 10px;
  }
  .home-intro p{
    color:#a9b8c2;
    font-size:14.5px;
    line-height:1.6;
    max-width:70ch;
  }
  .home-group{
    margin-bottom:36px;
  }
  .home-group h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(45,212,200,0.2);
  }
  .home-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .home-card{
    text-align:left;
    background:var(--ink-2);
    border:1px solid rgba(239,230,210,0.12);
    border-radius:6px;
    padding:18px 20px;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    color:var(--paper);
    font-family:'Inter',sans-serif;
  }
  .home-card:hover{
    border-color:var(--teal);
    transform:translateY(-2px);
  }
  .home-card .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:6px;
  }
  .home-card .card-desc{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8fa0ac;
    line-height:1.5;
  }

  @media (max-width:720px){
    .layout{ grid-template-columns:1fr; }
    nav{ border-right:none; border-bottom:1px solid rgba(239,230,210,0.12); display:flex; overflow-x:auto; padding:10px; gap:4px; }
    nav .nav-label{ display:none; }
    nav button{ width:auto; white-space:nowrap; }
    .doc{ padding:28px 22px; }
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">El Eco de las Mareas · MESA CHICA</span>
  <h1>Centro de documentos</h1>
  <button id="homeBtn" style="margin-left:auto;background:rgba(45,212,200,0.12);border:1px solid rgba(45,212,200,0.35);color:#EFE6D2;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border-radius:4px;cursor:pointer;">← Inicio</button>
</header>

<div class="lightbox-overlay" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕ Cerrar</button>
  <button class="lightbox-nav" id="lightboxPrev">‹</button>
  <button class="lightbox-nav" id="lightboxNext">›</button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption" style="display:none;"></div>
  <button class="lightbox-comments-btn" id="lightboxCommentsBtn" style="display:none;">💬 Comentarios</button>
  <a class="lightbox-download-btn" id="lightboxDownloadBtn" href="#" download>⬇ Descargar tamaño completo</a>
</div>

<div class="comments-drawer" id="commentsDrawer">
  <button class="comments-drawer-close" id="commentsDrawerClose">✕ Cerrar comentarios</button>
  <h4 id="commentsDrawerTitle">Comentarios</h4>
  <div class="term-label" id="commentsDrawerTerm"></div>
  <div id="commentsDrawerBody"></div>
</div>

<div class="layout">
  <nav id="nav">
    <button id="trailerBtn" style="width:100%;margin-bottom:16px;background:rgba(201,123,74,0.15);border:1px solid rgba(201,123,74,0.4);color:#EFE6D2;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;border-radius:4px;cursor:pointer;">🎬 Tráiler</button>
  </nav>
  <main id="main"><div class="empty-state">Elegí un documento del menú.</div></main>
</div>

<script>
// Cada documento: id, título de menú, descripción corta, y contenido markdown en base64 (UTF-8 safe).
// Para sumar un documento nuevo: agregá un objeto más a este array con su propio b64.
const DOCS = [
  {
    id: 'ficha_clara',
    title: 'Ficha — Clara Martínez',

function b64ToUtf8(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');

// Agrupar documentos preservando el orden de aparición de cada grupo en DOCS
const groupOrder = [];
const grouped = {};
DOCS.forEach(doc => {
  const g = doc.group || 'Documentos';
  if (!grouped[g]) { grouped[g] = []; groupOrder.push(g); }
  grouped[g].push(doc);
});

groupOrder.forEach(groupName => {
  const label = document.createElement('div');
  label.className = 'nav-label collapsed';
  label.innerHTML = '<span>' + groupName + '</span><span class="chevron">▾</span>';
  nav.appendChild(label);

  const itemsWrap = document.createElement('div');
  itemsWrap.className = 'nav-group-items collapsed';

  grouped[groupName].forEach(doc => {
    const btn = document.createElement('button');
    btn.innerHTML = doc.title + '<span class="doc-desc">' + doc.desc + '</span>';
    btn.addEventListener('click', () => selectDoc(doc.id, btn));
    btn.dataset.id = doc.id;
    itemsWrap.appendChild(btn);
  });
  nav.appendChild(itemsWrap);

  label.addEventListener('click', () => {
    label.classList.toggle('collapsed');
    itemsWrap.classList.toggle('collapsed');
  });
});

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text){
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand copy failed'));
    } catch (err) {
      document.body.removeChild(ta);
      reject(err);
    }
  });
}

function addCopyButtons(container){
  container.querySelectorAll('pre').forEach(pre => {
    const codeEl = pre.querySelector('code');
    if (!codeEl) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copiar';
    btn.addEventListener('click', () => {
      copyText(codeEl.textContent).then(() => {
        btn.textContent = 'Copiado ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 1500);
      }).catch(() => {
        btn.textContent = 'Error — seleccioná y copiá';
        setTimeout(() => { btn.textContent = 'Copiar'; }, 2500);
      });
    });
    wrap.appendChild(btn);
  });
}

function selectDoc(id, btnEl){
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  const md = b64ToUtf8(doc.b64);
  main.innerHTML = '<article class="doc">' + marked.parse(md) + '</article>';
  addCopyButtons(main);
}

function renderHome(){
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  let html = '<div class="home">';
  html += '<div class="home-intro"><h2>El Eco de las Mareas</h2><p>Centro de documentos del proyecto para el Future Vision XPRIZE. Acá vive todo lo que fuimos definiendo: personajes, la embarcación, las escenografías principales, y la producción del tráiler plano por plano. Elegí un documento del menú de la izquierda, o de las tarjetas de abajo.</p></div>';
  groupOrder.forEach(groupName => {
    html += '<div class="home-group"><h3>' + groupName + '</h3><div class="home-cards">';
    grouped[groupName].forEach(doc => {
      html += '<button class="home-card" data-id="' + doc.id + '"><div class="card-title">' + doc.title + '</div><div class="card-desc">' + doc.desc + '</div></button>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
  main.querySelectorAll('.home-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const btnEl = nav.querySelector('button[data-id="' + id + '"]');
      selectDoc(id, btnEl);
    });
  });
}

document.getElementById('homeBtn').addEventListener('click', renderHome);

// Vista inicial: el home, no un documento en particular
renderHome();

let editMode = false;

function renderTrailer(){
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  let html = '<div class="home">';
  html += '<div class="home-intro"><h2>El tráiler</h2><p>Storyboard y galería de planos ya generados, organizados por escena. Hacé clic en cualquier imagen para verla completa — con flechas para pasar a la siguiente dentro de la misma escena.</p></div>';
  html += '<div class="trailer-links">📄 <a href="https://colladoalan.github.io/Ecos-de-las-mareas/assets/storyboard_el_eco_de_las_mareas.html" target="_blank">Ver el storyboard completo (guion, diálogos, CLIPs)</a></div>';
  html += '<div class="edit-bar">' +
          '<button id="editModeBtn" class="edit-toggle-btn">' + (editMode ? '✓ Modo edición activo' : '✏️ Editar orden y nombres') + '</button>' +
          (editMode ? '<button id="exportChangesBtn" class="edit-toggle-btn export">📋 Copiar cambios para enviar</button><span class="edit-hint">Arrastrá las miniaturas para reordenar dentro de la escena. Hacé clic en un nombre para editarlo.</span>' : '') +
          '</div>';

  TRAILER_GALLERY.forEach((escGroup, gi) => {
    html += '<div class="trailer-esc"><h3>' + escGroup.title + '</h3>';
    html += '<button class="comments-toggle" data-esc-term="escena-' + escGroup.esc + '" data-esc-title="' + escGroup.title + '">💬 Comentarios generales de esta escena</button>';
    html += '<div class="trailer-grid" data-gi="' + gi + '">';
    escGroup.images.forEach((img, ii) => {
      html += '<div class="trailer-thumb' + (editMode ? ' editing' : '') + '" draggable="' + editMode + '" data-gi="' + gi + '" data-ii="' + ii + '">' +
              '<div class="frame16-9"><img src="' + img.file + '" alt="' + img.label + '"></div>' +
              (editMode
                ? '<input class="thumb-label-input" data-gi="' + gi + '" data-ii="' + ii + '" value="' + img.label.replace(/"/g,'&quot;') + '">'
                : '<div class="thumb-label">' + img.label + '</div>') +
              '</div>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;

  main.querySelectorAll('.comments-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      openCommentsDrawer(btn.dataset.escTitle + ' — comentarios generales', btn.dataset.escTerm);
    });
  });

  document.getElementById('editModeBtn').addEventListener('click', () => {
    editMode = !editMode;
    renderTrailer();
  });

  if (editMode) {
    const exportBtn = document.getElementById('exportChangesBtn');
    if (exportBtn) exportBtn.addEventListener('click', exportGalleryChanges);

    main.querySelectorAll('.thumb-label-input').forEach(inp => {
      inp.addEventListener('click', (e) => e.stopPropagation());
      inp.addEventListener('change', () => {
        const gi = parseInt(inp.dataset.gi, 10);
        const ii = parseInt(inp.dataset.ii, 10);
        TRAILER_GALLERY[gi].images[ii].label = inp.value;
      });
    });

    let dragSrc = null;
    main.querySelectorAll('.trailer-thumb').forEach(thumb => {
      thumb.addEventListener('dragstart', (e) => {
        dragSrc = thumb;
        e.dataTransfer.effectAllowed = 'move';
      });
      thumb.addEventListener('dragover', (e) => {
        e.preventDefault();
        if (thumb.dataset.gi === dragSrc?.dataset.gi) thumb.classList.add('drag-over');
      });
      thumb.addEventListener('dragleave', () => thumb.classList.remove('drag-over'));
      thumb.addEventListener('drop', (e) => {
        e.preventDefault();
        thumb.classList.remove('drag-over');
        if (!dragSrc || thumb === dragSrc) return;
        const gi = parseInt(thumb.dataset.gi, 10);
        if (gi !== parseInt(dragSrc.dataset.gi, 10)) return; // solo reordena dentro de la misma escena
        const fromIi = parseInt(dragSrc.dataset.ii, 10);
        const toIi = parseInt(thumb.dataset.ii, 10);
        const arr = TRAILER_GALLERY[gi].images;
        const [moved] = arr.splice(fromIi, 1);
        arr.splice(toIi, 0, moved);
        renderTrailer();
      });
    });
  } else {
    main.querySelectorAll('.trailer-thumb').forEach(thumb => {
      thumb.addEventListener('click', () => {
        const gi = parseInt(thumb.dataset.gi, 10);
        const ii = parseInt(thumb.dataset.ii, 10);
        openGalleryLightbox(gi, ii);
      });
    });
  }
}

function exportGalleryChanges(){
  let out = 'const TRAILER_GALLERY = [\n';
  TRAILER_GALLERY.forEach((escGroup, gi) => {
    out += '  {\n    esc: \'' + escGroup.esc + '\',\n    title: \'' + escGroup.title.replace(/'/g,"\\'") + '\',\n    images: [\n';
    escGroup.images.forEach((img, ii) => {
      out += '      {file: \'' + img.file + '\', full: \'' + (img.full || '') + '\', label: \'' + img.label.replace(/'/g,"\\'") + '\'}' + (ii < escGroup.images.length-1 ? ',' : '') + '\n';
    });
    out += '    ]\n  }' + (gi < TRAILER_GALLERY.length-1 ? ',' : '') + '\n';
  });
  out += '];';

  copyText(out).then(() => {
    alert('Copiado. Pegaselo a Claude en el chat para que aplique el nuevo orden y los nombres al sitio.');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = out;
    ta.style.position = 'fixed';
    ta.style.top = '10%';
    ta.style.left = '10%';
    ta.style.width = '80%';
    ta.style.height = '70%';
    ta.style.zIndex = '2000';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
  });
}

document.getElementById('trailerBtn').addEventListener('click', () => { editMode = false; renderTrailer(); });

// ---- Sistema de comentarios (Giscus — usa GitHub Discussions del repo) ----
// IMPORTANTE: reemplazar GISCUS_REPO_ID y GISCUS_CATEGORY_ID con los valores reales
// que da https://giscus.app una vez que actives Discussions en el repo e instales la app.
const GISCUS_CONFIG = {
  repo: 'colladoalan/Ecos-de-las-mareas',
  repoId: 'R_kgDOTpWMlg',
  category: 'General',
  categoryId: 'DIC_kwDOTpWMls4DCZOd'
};

function loadGiscus(containerEl, term){
  containerEl.innerHTML = '';
  const script = document.createElement('script');
  script.src = 'https://giscus.app/client.js';
  script.setAttribute('data-repo', GISCUS_CONFIG.repo);
  script.setAttribute('data-repo-id', GISCUS_CONFIG.repoId);
  script.setAttribute('data-category', GISCUS_CONFIG.category);
  script.setAttribute('data-category-id', GISCUS_CONFIG.categoryId);
  script.setAttribute('data-mapping', 'specific');
  script.setAttribute('data-term', term);
  script.setAttribute('data-strict', '0');
  script.setAttribute('data-reactions-enabled', '1');
  script.setAttribute('data-emit-metadata', '0');
  script.setAttribute('data-input-position', 'top');
  script.setAttribute('data-theme', 'dark_dimmed');
  script.setAttribute('data-lang', 'es');
  script.setAttribute('crossorigin', 'anonymous');
  script.async = true;
  containerEl.appendChild(script);
}

const commentsDrawer = document.getElementById('commentsDrawer');
function openCommentsDrawer(title, term){
  document.getElementById('commentsDrawerTitle').textContent = title;
  document.getElementById('commentsDrawerTerm').textContent = 'Hilo: ' + term;
  loadGiscus(document.getElementById('commentsDrawerBody'), term);
  commentsDrawer.classList.add('open');
}
document.getElementById('commentsDrawerClose').addEventListener('click', () => {
  commentsDrawer.classList.remove('open');
});

// Botón de comentarios dentro del lightbox — solo visible cuando se está viendo una imagen de la galería
const lightboxCommentsBtn = document.getElementById('lightboxCommentsBtn');
lightboxCommentsBtn.addEventListener('click', () => {
  if (!currentGallery) return;
  const group = TRAILER_GALLERY[currentGallery.gi];
  const img = group.images[currentGallery.ii];
  const term = 'plano-' + img.file.split('/').pop().replace('.jpg', '');
  openCommentsDrawer(group.title + ' — ' + img.label, term);
});

// ---- Lightbox con navegación de galería ----
let currentGallery = null; // {gi, ii}
function openGalleryLightbox(gi, ii){
  currentGallery = {gi, ii};
  showGalleryImage();
  lightbox.classList.add('open');
}
function showGalleryImage(){
  const group = TRAILER_GALLERY[currentGallery.gi];
  const img = group.images[currentGallery.ii];
  lightboxImg.src = img.file;
  lightboxImg.alt = img.label;
  document.getElementById('lightboxCaption').textContent = group.title + ' — ' + img.label;
  document.getElementById('lightboxCaption').style.display = 'block';
  document.getElementById('lightboxPrev').classList.add('visible');
  document.getElementById('lightboxNext').classList.add('visible');
  document.getElementById('lightboxCommentsBtn').style.display = 'block';
  const dlBtn = document.getElementById('lightboxDownloadBtn');
  dlBtn.href = img.full || img.file;
  dlBtn.style.display = 'block';
}
document.getElementById('lightboxPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!currentGallery) return;
  const group = TRAILER_GALLERY[currentGallery.gi];
  currentGallery.ii = (currentGallery.ii - 1 + group.images.length) % group.images.length;
  showGalleryImage();
});
document.getElementById('lightboxNext').addEventListener('click', (e) => {
  e.stopPropagation();
  if (!currentGallery) return;
  const group = TRAILER_GALLERY[currentGallery.gi];
  currentGallery.ii = (currentGallery.ii + 1) % group.images.length;
  showGalleryImage();
});
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open') || !currentGallery) return;
  if (e.key === 'ArrowLeft') document.getElementById('lightboxPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lightboxNext').click();
});

// Lightbox: clic en cualquier imagen del documento la abre en grande
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
main.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG' && e.target.closest('.doc')) {
    currentGallery = null;
    document.getElementById('lightboxPrev').classList.remove('visible');
    document.getElementById('lightboxNext').classList.remove('visible');
    document.getElementById('lightboxCaption').style.display = 'none';
    document.getElementById('lightboxCommentsBtn').style.display = 'none';
    document.getElementById('lightboxDownloadBtn').style.display = 'none';
    lightboxImg.src = e.target.src;
    lightboxImg.alt = e.target.alt || '';
    lightbox.classList.add('open');
  }
});
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src='';
  currentGallery = null;
  document.getElementById('lightboxPrev').classList.remove('visible');
  document.getElementById('lightboxNext').classList.remove('visible');
  document.getElementById('lightboxCaption').style.display = 'none';
  document.getElementById('lightboxCommentsBtn').style.display = 'none';
  document.getElementById('lightboxDownloadBtn').style.display = 'none';
}
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.getElementById('lightboxClose').addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
</script>
