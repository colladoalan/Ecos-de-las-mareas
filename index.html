<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Eco de las Mareas — Centro de documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{
    --ink:#0B1826;
    --ink-2:#122236;
    --paper:#EFE6D2;
    --paper-2:#E4D8BC;
    --paper-line:#C9BC9E;
    --teal:#2DD4C8;
    --teal-dim:#1a8f86;
    --copper:#C97B4A;
    --ink-text:#1c2b1f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:20px 28px;
    border-bottom:1px solid rgba(239,230,210,0.15);
    background:radial-gradient(ellipse at 0% 0%, rgba(45,212,200,0.10), transparent 60%), var(--ink);
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--teal);
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .layout{
    flex:1;
    display:grid;
    grid-template-columns:260px 1fr;
    min-height:0;
  }
  nav{
    border-right:1px solid rgba(239,230,210,0.12);
    padding:20px 14px;
    overflow-y:auto;
  }
  nav .nav-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#5f7280;
    padding:6px 10px 10px;
    margin-top:18px;
  }
  nav .nav-label:first-child{ margin-top:0; }
  nav button{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:#a9b8c2;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    padding:10px 10px;
    border-radius:4px;
    cursor:pointer;
    margin-bottom:2px;
    line-height:1.4;
    border-left:2px solid transparent;
  }
  nav button:hover{ background:rgba(45,212,200,0.08); color:var(--paper); }
  nav button.active{
    background:rgba(45,212,200,0.12);
    color:var(--paper);
    border-left:2px solid var(--teal);
    font-weight:500;
  }
  nav button .doc-desc{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:#5f7280;
    margin-top:2px;
  }
  main{
    overflow-y:auto;
    padding:44px clamp(20px,5vw,72px) 80px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(45,212,200,0.06), transparent 55%),
      var(--ink);
  }
  .doc{
    max-width:780px;
    margin:0 auto;
    background:var(--paper);
    color:var(--ink-text);
    border-radius:6px;
    padding:44px 48px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
  }
  .doc h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    margin:0 0 4px;
    line-height:1.1;
  }
  .doc h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:32px 0 10px;
    padding-top:14px;
    border-top:1px solid var(--paper-line);
  }
  .doc h3{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16.5px;
    margin:22px 0 8px;
    color:#3a4a3a;
  }
  .doc h3 + p, .doc h3 + pre { margin-top:0; }
  .doc p{ font-size:14.5px; line-height:1.65; margin:0 0 14px; }
  .doc strong{ color:#0f1a12; }
  .doc em{ color:#4a5a48; }
  .doc ul, .doc ol{ font-size:14.5px; line-height:1.65; padding-left:22px; margin:0 0 14px;}
  .doc li{ margin-bottom:4px; }
  .doc hr{ border:none; border-top:1px dashed var(--paper-line); margin:26px 0; }
  .doc code{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:rgba(0,0,0,0.06);
    padding:1px 5px;
    border-radius:3px;
  }
  .doc .code-wrap{
    position:relative;
    margin:0 0 16px;
  }
  .doc pre{
    background:var(--ink);
    color:#cfe8e4;
    border-left:3px solid var(--copper);
    padding:16px 16px 16px;
    border-radius:4px;
    overflow-x:auto;
    margin:0;
  }
  .doc pre code{
    background:none;
    padding:0;
    font-size:12.5px;
    line-height:1.8;
    color:#cfe8e4;
    white-space:pre-wrap;
  }
  .copy-btn{
    position:absolute;
    top:8px;
    right:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#cfe8e4;
    background:rgba(45,212,200,0.12);
    border:1px solid rgba(45,212,200,0.35);
    border-radius:4px;
    padding:5px 9px;
    cursor:pointer;
  }
  .copy-btn:hover{ background:rgba(45,212,200,0.22); }
  .copy-btn.copied{ background:var(--teal); color:#08201c; border-color:var(--teal); }


  .doc table{ width:100%; border-collapse:collapse; font-size:13.5px; margin:0 0 16px;}
  .doc th, .doc td{ border:1px solid var(--paper-line); padding:6px 10px; text-align:left; }
  .doc th{ background:rgba(0,0,0,0.05); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;}

  .empty-state{
    max-width:480px;
    margin:120px auto;
    text-align:center;
    color:#7f92a0;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
  }

  .home{
    max-width:960px;
    margin:0 auto;
  }
  .home-intro{
    margin-bottom:40px;
  }
  .home-intro h2{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:32px;
    color:var(--paper);
    margin:0 0 10px;
  }
  .home-intro p{
    color:#a9b8c2;
    font-size:14.5px;
    line-height:1.6;
    max-width:70ch;
  }
  .home-group{
    margin-bottom:36px;
  }
  .home-group h3{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:1px solid rgba(45,212,200,0.2);
  }
  .home-cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .home-card{
    text-align:left;
    background:var(--ink-2);
    border:1px solid rgba(239,230,210,0.12);
    border-radius:6px;
    padding:18px 20px;
    cursor:pointer;
    transition:border-color .15s, transform .15s;
    color:var(--paper);
    font-family:'Inter',sans-serif;
  }
  .home-card:hover{
    border-color:var(--teal);
    transform:translateY(-2px);
  }
  .home-card .card-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    margin-bottom:6px;
  }
  .home-card .card-desc{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:#8fa0ac;
    line-height:1.5;
  }

  @media (max-width:720px){
    .layout{ grid-template-columns:1fr; }
    nav{ border-right:none; border-bottom:1px solid rgba(239,230,210,0.12); display:flex; overflow-x:auto; padding:10px; gap:4px; }
    nav .nav-label{ display:none; }
    nav button{ width:auto; white-space:nowrap; }
    .doc{ padding:28px 22px; }
  }
</style>
</head>

<header>
  <span class="eyebrow">El Eco de las Mareas · MESA CHICA</span>
  <h1>Centro de documentos</h1>
  <button id="homeBtn" style="margin-left:auto;background:rgba(45,212,200,0.12);border:1px solid rgba(45,212,200,0.35);color:#EFE6D2;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px 16px;border-radius:4px;cursor:pointer;">← Inicio</button>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"><div class="empty-state">Elegí un documento del menú.</div></main>
</div>

function b64ToUtf8(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

const nav = document.getElementById('nav');
const main = document.getElementById('main');

// Agrupar documentos preservando el orden de aparición de cada grupo en DOCS
const groupOrder = [];
const grouped = {};
DOCS.forEach(doc => {
  const g = doc.group || 'Documentos';
  if (!grouped[g]) { grouped[g] = []; groupOrder.push(g); }
  grouped[g].push(doc);
});

groupOrder.forEach(groupName => {
  const label = document.createElement('div');
  label.className = 'nav-label';
  label.textContent = groupName;
  nav.appendChild(label);

  grouped[groupName].forEach(doc => {
    const btn = document.createElement('button');
    btn.innerHTML = doc.title + '<span class="doc-desc">' + doc.desc + '</span>';
    btn.addEventListener('click', () => selectDoc(doc.id, btn));
    btn.dataset.id = doc.id;
    nav.appendChild(btn);
  });
});

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text){
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('execCommand copy failed'));
    } catch (err) {
      document.body.removeChild(ta);
      reject(err);
    }
  });
}

function addCopyButtons(container){
  container.querySelectorAll('pre').forEach(pre => {
    const codeEl = pre.querySelector('code');
    if (!codeEl) return;
    const wrap = document.createElement('div');
    wrap.className = 'code-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.textContent = 'Copiar';
    btn.addEventListener('click', () => {
      copyText(codeEl.textContent).then(() => {
        btn.textContent = 'Copiado ✓';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'Copiar'; btn.classList.remove('copied'); }, 1500);
      }).catch(() => {
        btn.textContent = 'Error — seleccioná y copiá';
        setTimeout(() => { btn.textContent = 'Copiar'; }, 2500);
      });
    });
    wrap.appendChild(btn);
  });
}

function selectDoc(id, btnEl){
  const doc = DOCS.find(d => d.id === id);
  if (!doc) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  const md = b64ToUtf8(doc.b64);
  main.innerHTML = '<article class="doc">' + marked.parse(md) + '</article>';
  addCopyButtons(main);
}

function renderHome(){
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  let html = '<div class="home">';
  html += '<div class="home-intro"><h2>El Eco de las Mareas</h2><p>Centro de documentos del proyecto para el Future Vision XPRIZE. Acá vive todo lo que fuimos definiendo: personajes, la embarcación, las escenografías principales, y la producción del tráiler plano por plano. Elegí un documento del menú de la izquierda, o de las tarjetas de abajo.</p></div>';
  groupOrder.forEach(groupName => {
    html += '<div class="home-group"><h3>' + groupName + '</h3><div class="home-cards">';
    grouped[groupName].forEach(doc => {
      html += '<button class="home-card" data-id="' + doc.id + '"><div class="card-title">' + doc.title + '</div><div class="card-desc">' + doc.desc + '</div></button>';
    });
    html += '</div></div>';
  });
  html += '</div>';
  main.innerHTML = html;
  main.querySelectorAll('.home-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const btnEl = nav.querySelector('button[data-id="' + id + '"]');
      selectDoc(id, btnEl);
    });
  });
}

document.getElementById('homeBtn').addEventListener('click', renderHome);

// Vista inicial: el home, no un documento en particular
renderHome();
</script>
